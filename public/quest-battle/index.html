<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cycle Quest · Battle playtest</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff1ce;font:16px/1.4 system-ui,sans-serif}main{max-width:740px;margin:auto;padding:clamp(12px,4vw,32px)}header,.line,.tools,.health{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:bold 18px Georgia,serif;letter-spacing:.12em}.tools button,button{font:inherit;color:inherit;background:#263750;border:1px solid #71829c;padding:10px 13px;border-radius:4px;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,input:focus-visible{outline:3px solid #ffd378}.field{margin-top:20px;background:linear-gradient(#293b53,#485667 75%,#596149 76%,#303e32);display:grid;place-items:center;min-height:145px;border:1px solid #536175}.field img{height:115px;max-width:85%;object-fit:contain;image-rendering:pixelated}.hud{background:#17253c;border:2px solid #687e98;color:#fff2d5;height:170px;padding:12px;display:grid;grid-template-rows:1fr auto;gap:5px;font:16px/1.25 system-ui,sans-serif}.top{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:clamp(8px,3vw,28px);align-items:center}.hud small{display:block;font:700 12px monospace;color:#cdd6e2}.hud strong{display:block;font:bold clamp(26px,5vw,40px)/1.1 monospace;color:#ffcf80}.hud.guard strong{color:#a9dfff}.cue{min-height:20px;font-weight:600}.health>div{width:50%;min-width:0}.health span{display:flex;justify-content:space-between;font:700 14px monospace}.health i,.health em{display:block;height:7px;background:#46546b;margin-top:5px}.health em{background:#8bd4a8}.health>div+div em{background:#efa187}.controls{padding:18px 0}.controls input{width:100%;accent-color:#ffc978;height:46px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.primary{background:#ffca7c;color:#1a2230;font-weight:700}.note{color:#d4deec;min-height:2.6em}.tools{justify-content:flex-end}h1{margin:0;font:bold clamp(24px,5vw,34px) Georgia,serif}output{font:bold 20px monospace}.floating{margin:0;background:#17253c}.floating .hud{width:100%}@media(max-width:420px){.hud{padding:9px}.hud small{font-size:11px}.health span{font-size:12px}header{flex-wrap:wrap}}
</style></head>
<body><main><header><div><div class="brand">CYCLE QUEST</div><h1>Battle playtest</h1></div><div class="tools"><button id="overlay">Open overlay ↗</button></div></header>
<div class="field"><img id="art" src="/monsters/rat.png" alt=""></div>
<section class="hud" aria-label="Battle overlay"><div class="top"><div><small id="owner">YOUR TURN</small><strong id="phase">ATTACK</strong><div class="cue" id="cue">Pedal to strike</div></div><div><small>TIME</small><strong id="clock">5s</strong></div><div><small>POWER</small><strong id="power">180 W</strong></div></div>
<div class="health"><div><span>RIDER <b id="rhp">100 HP</b></span><i><em id="rbar"></em></i></div><div><span><label id="enemy">RAT</label><b id="ehp"></b></span><i><em id="ebar"></em></i></div></div></section>
<section class="controls"><div class="line"><label for="effort">Pedaling effort</label><output for="effort" id="reading">180 W</output></div><input id="effort" type="range" min="0" max="350" step="5" value="180"><div class="buttons"><button class="primary" id="play">Start battle</button><button id="again" hidden>Fight again</button></div><p class="note" id="notice" aria-live="polite">Move the slider to pedal. Higher watts deal more damage on your turn. Match the shown range on the enemy’s turn to block up to half the hit.</p></section>
</main><script type="module" src="./play.js"></script></body></html>
