name: Spokemon Standalone
on:
  push:
    branches:
      - feature/spokemon-standalone-extraction-20261102
    paths:
      - 'apps/spokemon/**'
      - '.github/workflows/spokemon-standalone.yml'
  pull_request:
    paths:
      - 'apps/spokemon/**'
      - '.github/workflows/spokemon-standalone.yml'
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/spokemon
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
