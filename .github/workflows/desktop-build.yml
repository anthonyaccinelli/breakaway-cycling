name: Desktop build validation
on:
  push:
    branches: ['desktop/**']
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run desktop:build
      - name: Offline route smoke test
        run: npm run desktop:smoke
      - run: npm run desktop:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: breakaway-desktop-${{ matrix.os }}
          path: release/*
          if-no-files-found: warn
