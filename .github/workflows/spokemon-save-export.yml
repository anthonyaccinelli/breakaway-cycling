name: Spokemon legacy save export
on:
  push:
    branches: [feature/spokemon-save-export-20261102]
  pull_request:
    paths: ['src/spokemon-playable.ts','tests/spokemon-save-export.test.mjs','.github/workflows/spokemon-save-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22'}
      - run: npm ci
      - run: node --test tests/spokemon-save-export.test.mjs
      - run: npm run build
