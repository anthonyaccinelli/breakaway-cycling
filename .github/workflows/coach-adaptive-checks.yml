name: Breakaway Coach integration checks
on:
  pull_request:
    paths:
      - 'src/main.ts'
      - 'src/coach-route.ts'
      - 'src/vendor/breakaway-coach/**'
      - 'src/classic-route-reference.ts'
      - 'tests/coach*.test.mjs'
      - '.github/workflows/coach-adaptive-checks.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/coach*.test.mjs
