name: Breakaway Coach adaptive checks
on:
  push:
    branches:
      - feat/coach-next-steps-2026-11-01
  pull_request:
    paths:
      - 'src/coach*.ts'
      - 'src/coach*.css'
      - 'tests/coach*.test.mjs'
      - '.github/workflows/coach-adaptive-checks.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
